[project]
name = "var"
version = "0.2.0"
description = "Verified Agent Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
]

[project.scripts]
var = "var.cli:main"
var-course = "var.apps.course.cli:main"
var-home = "var.apps.home.cli:main"
var-bench = "var.apps.research.run_bench:main"
var-golden = "var.eval.golden_suite:main"
var-brutal = "var.eval.brutal_suite:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["var"]
